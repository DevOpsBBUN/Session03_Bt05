server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Thư mục web mới đặt trong phân vùng /opt
    root /opt/my-app/html;
    index index.html;

    # Cấu hình lưu log riêng cho ứng dụng
    access_log /opt/my-app/logs/access.log;
    error_log /opt/my-app/logs/error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
